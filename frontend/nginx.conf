server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài sản tĩnh có hash
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Không cache index.html để bản deploy mới có hiệu lực ngay
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
