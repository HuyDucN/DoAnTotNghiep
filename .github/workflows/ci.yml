name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Check Alembic single head
        run: alembic -c backend/alembic.ini heads | grep -qi "1 head" || (echo "Multiple Alembic heads!" && alembic -c backend/alembic.ini heads && exit 1)
      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc -b
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Run frontend tests
        run: npm --prefix frontend test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=http://localhost:8000/api -t frontend:ci ./frontend
